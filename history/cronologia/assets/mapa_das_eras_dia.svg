="normal" text-anchor="start">interface</text><text x="32" y="982" font-size="11.5" fill="#CFC6DA" font-weight="normal" text-anchor="start">o cosmos no PC</text><text x="20" y="1036" font-size="11.5" fill="#6E6578" font-weight="normal" text-anchor="start">As datas da Era 1 foram conferidas com os registros da época.</text></svg>