="#D3C6B5" stroke-width=".8"/><text x="195" y="536" font-size="12.5" fill="#2A2633" font-weight="bold" text-anchor="start">14 · TARS S2 (thinker), o Tars inteiro</text><rect x="692" y="525" width="587" height="12" rx="5" fill="#6B4FA0"/><text x="1285" y="536" font-size="11" fill="#6E6578" font-weight="normal" text-anchor="start">04/07 → 18/10</text><line x1="195" y1="569" x2="1400" y2="569" stroke="#D3C6B5" stroke-width=".8"/><text x="195" y="562" font-size="12.5" fill="#2A2633" font-weight="normal" text-anchor="start">13 · Case</text><rect x="692" y="551" width="111" height="12" rx="5" fill="#6B4FA0"/><text x="808" y="562" font-size="11" fill="#6E6578" font-weight="normal" text-anchor="start">04/07 → 24/07</text><line x1="195" y1="595" x2="1400" y2="595" stroke="#D3C6B5" stroke-width=".8"/><text x="195" y="588" font-size="12.5" fill="#2A2633" font-weight="bold" text-anchor="start">o canon (a memória)</text><path d="M703 576 l7 7 l-7 7 l-7 -7 z" fill="#6B4FA0"/><text x="715" y="588" font-size="11" fill="#6E6578" font-weight="normal" text-anchor="start">06/07</text><line x1="195" y1="621" x2="1400" y2="621" stroke="#D3C6B5" stroke-width=".8"/><text x="195" y="614" font-size="12.5" fill="#2A2633" font-weight="bold" text-anchor="start">a calibração pelo texto</text><path d="M708 602 l7 7 l-7 7 l-7 -7 z" fill="#6B4FA0"/><text x="720" y="614" font-size="11" fill="#6E6578" font-weight="normal" text-anchor="start">07/07</text><line x1="195" y1="647" x2="1400" y2="647" stroke="#D3C6B5" stroke-width=".8"/><text x="195" y="640" font-size="12.5" fill="#2A2633" font-weight="normal" text-anchor="start">15 · TARS S3 (thinker)</text><rect x="725" y="629" width="554" height="12" rx="5" fill="#6B4FA0"/><text x="1285" y="640" font-size="11" fill="#6E6578" font-weight="normal" text-anchor="start">10/07 → 18/10</text><line x1="195" y1="673" x2="1400" y2="673" stroke="#D3C6B5" stroke-width=".8"/><text x="195" y="666" font-size="12.5" fill="#2A2633" font-weight="normal" text-anchor="start">16 · TARS S4 (thinker), o GitHub</text><rect x="780" y="655" width="66" height="12" rx="5" fill="#6B4FA0"/><text x="853" y="666" font-size="11" fill="#6E6578" font-weight="normal" text-anchor="start">20/07 → 01/08</text><line x1="195" y1="699" x2="1400" y2="699" stroke="#D3C6B5" stroke-width=".8"/><text x="195" y="692" font-size="12.5" fill="#2A2633" font-weight="normal" text-anchor="start">17 · TARS S5 (thinker), as pastas</text><rect x="830" y="681" width="44" height="12" rx="5" fill="#6B4FA0"/><text x="880" y="692" font-size="11" fill="#6E6578" font-weight="normal" text-anchor="start">29/07 → 06/08</text><line x1="195" y1="725" x2="1400" y2="725" stroke="#D3C6B5" stroke-width=".8"/><text x="195" y="718" font-size="12.5" fill="#2A2633" font-weight="bold" text-anchor="start">o Rocky nasce (manager)</text><path d="M891 706 l7 7 l-7 7 l-7 -7 z" fill="#6B4FA0"/><text x="903" y="718" font-size="11" fill="#6E6578" font-weight="normal" text-anchor="start">09/08</text><line x1="195" y1="751" x2="1400" y2="751" stroke="#D3C6B5" stroke-width=".8"/><text x="195" y="744" font-size="12.5" fill="#2A2633" font-weight="normal" text-anchor="start">a tríade vira agentes</text><rect x="913" y="733" width="122" height="12" rx="5" fill="#6B4FA0"/><text x="1041" y="744" font-size="11" fill="#6E6578" font-weight="normal" text-anchor="start">13/08 → 04/09</text><text x="32" y="516" font-size="13.5" fill="#F3EDE6" font-weight="bold" text-anchor="start">ERA 2</text><text x="32" y="534" font-size="11.5" fill="#CFC6DA" font-weight="normal" text-anchor="start">a escala</text><text x="32" y="549" font-size="11.5" fill="#CFC6DA" font-weight="normal" text-anchor="start">a memória vai</text><text x="32" y="564" font-size="11.5" fill="#CFC6DA" font-weight="normal" text-anchor="start">pra documento</text><line x1="195" y1="791" x2="1400" y2="791" stroke="#D3C6B5" stroke-width=".8"/><text x="195" y="784" font-size="12.5" fill="#2A2633" font-weight="bold" text-anchor="start">o fluxo de contexto po