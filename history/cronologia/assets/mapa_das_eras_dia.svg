<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="1060" viewBox="0 0 1420 1060" font-family="ui-monospace,Consolas,monospace"><title>O mapa das eras (dia)</title><rect width="1420" height="1060" fill="#E7DCD0"/><line x1="1185" y1="126" x2="1185" y2="1020" stroke="#D3C6B5" stroke-width="1"/><line x1="1019" y1="126" x2="1019" y2="1020" stroke="#D3C6B5" stroke-width="1"/><line x1="847" y1="126" x2="847" y2="1020" stroke="#D3C6B5" stroke-width="1"/><line x1="675" y1="126" x2="675" y2="1020" stroke="#D3C6B5" stroke-width="1"/><line x1="509" y1="126" x2="509" y2="1020" stroke="#D3C6B5" stroke-width="1"/><rect x="20" y="128" width="160" height="24" rx="6" fill="#2A2633"/><rect x="20" y="168" width="160" height="310" rx="6" fill="#2A2633"/><rect x="20" y="494" width="160" height="258" rx="6" fill="#2A2633"/><rect x="20" y="768" width="160" height="128" rx="6" fill="#2A2633"/><rect x="20" y="912" width="160" height="102" rx="6" fill="#2A2633"/><text x="20" y="40" font-size="16" fill="#6B4FA0" font-weight="bold" text-anchor="start">// o mapa das eras · constellation method</text><text x="20" y="62" font-size="12" fill="#6E6578" font-weight="normal" text-anchor="start">uma linha por coisa · a barra é quando existiu</text><text x="20" y="84" font-size="11.5" fill="#6E6578" font-weight="normal" text-anchor="start">tracejado = data aproximada · losango = um dia só · em negrito = marco · as instâncias da Era 1 vão por número</text><text x="195" y="118" font-size="12" fill="#6E6578" font-weight="bold" text-anchor="start">o quê</text><text x="509" y="118" font-size="12" fill="#6E6578" font-weight="normal" text-anchor="middle">jun</text><text x="675" y="118" font-size="12" fill="#6E6578" font-weight="normal" text-anchor="middle">jul</text><text x="847" y="118" font-size="12" fill="#6E6578" font-weight="normal" text-anchor="middle">ago</text><text x="1019" y="118" font-size="12" fill="#6E6578" font-weight="normal" text-anchor="middle">set</text><text x="1185" y="118" font-size="12" fill="#6E6578" font-weight="normal" text-anchor="middle">out</text><line x1="195" y1="151" x2="1400" y2="151" stroke="#D3C6B5" stroke-width=".8"/><text x="195" y="144" font-size="12.5" fill="#2A2633" font-weight="bold" text-anchor="start">a ideia, num diário à mão</text><text x="470" y="144" font-size="12" fill="#6B4FA0" font-weight="bold" text-anchor="start">22/10/2023 · colocar os diários numa IA pra ensinar a ela quem ela é</text><text x="32" y="144" font-size="13.5" fill="#F3EDE6" font-weight="bold" text-anchor="start">antes · os diários</text><line x1="195" y1="191" x2="1400" y2="191" stroke="#D3C6B5" stroke-width=".8"/><text x="195" y="184" font-size="12.5" fill="#2A2633" font-weight="normal" text-anchor="start">01 · a origem</text><rect x="498" y="173" width="111" height="12" rx="5" fill="#6B4FA0"/><text x="615" y="184" font-size="11" fill="#6E6578" font-weight="normal" text-anchor="start">30/05 → 19/06</text><line x1="195" y1="217" x2="1400" y2="217" stroke="#D3C6B5" stroke-width=".8"/><text x="195" y="210" font-size="12.5" fill="#2A2633" font-weight="normal" text-anchor="start">02 · nasce o manual</text><rect x="487" y="199" width="94" height="12" rx="5" fill="#6B4FA0"/><text x="587" y="210" font-size="11" fill="#6E6578" font-weight="normal" text-anchor="start">28/05 → 14/06</text><line x1="195" y1="243" x2="1400" y2="243" stroke="#D3C6B5" stroke-width=".8"/><text x="195" y="236" font-size="12.5" fill="#2A2633" font-weight="normal" text-anchor="start">imagens geradas na época</text><rect x="503" y="225" width="94" height="12" rx="5" fill="#6B4FA0"/><text x="603" y="236" font-size="11" fill="#6E6578" font-weight="normal" text-anchor="start">31/05 → 17/06</text><line x1="195" y1="269" x2="1400" y2="269" stroke="#D3C6B5" stroke-width=".8"/><text x="195" y="262" font-size="12.5" fill="#2A2633" font-weight="normal" text-anchor="start">03</text><rect x="520" y="251" width="61" height="12" rx="5" fill="#6B4FA0"/><text x="587" y="262" font-size="11" fill="