<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" role="img" aria-label="Desenho do estudo"><style>text{font-family:ui-monospace,Consolas,Menlo,monospace;fill:#22202a}.r{font-size:12px}.g{font-size:12px;font-weight:700;letter-spacing:.05em}.x{font-size:11px;fill:#5b5862}.n{font-size:11px;font-weight:700}.t{font-size:14px;font-weight:700}</style><rect width="1000" height="300" fill="#f4efe8"/><defs><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b5862"/></marker></defs><text x="12" y="20" class="t">O desenho do estudo</text><rect x="20" y="50" width="170" height="56" rx="6" fill="#fff" stroke="#5b5862"/><text x="105.0" y="75.0" text-anchor="middle" class="n" style="font-size:12px">3 repositórios</text><text x="105.0" y="92.0" text-anchor="middle" class="x">congelados em um commit</text><line x1="190" y1="78" x2="222" y2="78" stroke="#5b5862" stroke-width="1.5" marker-end="url(#s)"/><rect x="225" y="50" width="170" height="56" rx="6" fill="#fff" stroke="#5b5862"/><text x="310.0" y="75.0" text-anchor="middle" class="n" style="font-size:12px">3 dossiês de texto</text><text x="310.0" y="92.0" text-anchor="middle" class="x">iguais para todos</text><line x1="395" y1="78" x2="427" y2="78" stroke="#5b5862" stroke-width="1.5" marker-end="url(#s)"/><rect x="430" y="50" width="250" height="56" rx="6" fill="#fff" stroke="#5b5862"/><text x="555.0" y="75.0" text-anchor="middle" class="n" style="font-size:12px">6 modelos × 3 condições × 5</text><text x="555.0" y="92.0" text-anchor="middle" class="x">270 avaliações, sem ferramentas</text><line x1="680" y1="78" x2="712" y2="78" stroke="#5b5862" stroke-width="1.5" marker-end="url(#s)"/><rect x="715" y="50" width="265" height="56" rx="6" fill="#fff" stroke="#5b5862"/><text x="847.5" y="75.0" text-anchor="middle" class="n" style="font-size:12px">extração às cegas</text><text x="847.5" y="92.0" text-anchor="middle" class="x">11.832 afirmações</text><line x1="848" y1="106" x2="848" y2="138" stroke="#5b5862" stroke-width="1.5" marker-end="url(#s)"/><rect x="715" y="140" width="265" height="56" rx="6" fill="#eaf6f0" stroke="#5b5862"/><text x="847.5" y="165.0" text-anchor="middle" class="n" style="font-size:12px">gabarito (veredito)</text><text x="847.5" y="182.0" text-anchor="middle" class="x">2 conferidores + amostra com clone + juiz</text><line x1="715" y1="168" x2="683" y2="168" stroke="#5b5862" stroke-width="1.5" marker-end="url(#s)"/><rect x="430" y="140" width="250" height="56" rx="6" fill="#ece9fb" stroke="#5b5862"/><text x="555.0" y="165.0" text-anchor="middle" class="n" style="font-size:12px">rótulo de cada afirmação</text><text x="555.0" y="182.0" text-anchor="middle" class="x">juiz cego: modelo, condição, repo</text><line x1="430" y1="168" x2="398" y2="168" stroke="#5b5862" stroke-width="1.5" marker-end="url(#s)"/><rect x="225" y="140" width="170" height="56" rx="6" fill="#fbe9f0" stroke="#5b5862"/><text x="310.0" y="165.0" text-anchor="middle" class="n" style="font-size:12px">ressalva (🍷)</text><text x="310.0" y="182.0" text-anchor="middle" class="x">lida no texto do laudo</text><line x1="310" y1="196" x2="310" y2="228" stroke="#5b5862" stroke-width="1.5" marker-end="url(#s)"/><rect x="20" y="230" width="960" height="50" rx="6" fill="#fff" stroke="#5b5862"/><text x="500.0" y="252.0" text-anchor="middle" class="n" style="font-size:12px">análise: cada condição comparada com o &quot;cru&quot; dentro do mesmo repositório</text><text x="500.0" y="269.0" text-anchor="middle" class="x">2 métricas primárias do protocolo + análise exploratória (postura, volume, ressalva)</text></svg>